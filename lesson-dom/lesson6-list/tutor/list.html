<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lessonb 6 - List</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;

        width: 100vw;
        height: 100vh;

        background-color: beige;
        color: blue;

        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }

      div {
        padding: 10px;
        border: 2px solid blue;
      }
    </style>
  </head>
  <body>
    <div class="life-goals">
      <label>Life Goals</label>
      <ul>
        <li>Car</li>
        <li>House</li>
        <li>Wife</li>
        <li>Kids</li>
      </ul>
    </div>
    <div class="todo-list">
      <label>Todo List</label>
      <ol>
        <li>Wash car</li>
        <li>Wash motor</li>
        <li>Wash house</li>
      </ol>
    </div>
  </body>
</html>
