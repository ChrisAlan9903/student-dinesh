<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lessonb 6 - List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="life-goals">
      <label><b>Life Goals</b></label>
      <div>
        <input
          id="life-goals-input"
          type="text"
          placeholder="Enter your life goals"
        />
        <button class="enter-btn-life-goals">Enter</button>
      </div>
      <ul>
        <li>Car</li>
        <li>House</li>
        <li>Wife</li>
        <li>Kids</li>
      </ul>
    </div>
    <div class="todo-list">
      <label><b>Todo List</b></label>
      <div id="todo-list-input">
        <input type="text" placeholder="Enter your todo lists" />
        <button class="enter-btn-todo-list">Enter</button>
      </div>
      <ol>
        <li>Wash car</li>
        <li>Wash motor</li>
        <li>Wash house</li>
      </ol>
    </div>
    <script src="script.js"></script>
  </body>
</html>
